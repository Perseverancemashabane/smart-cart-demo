<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Smart Cart - Project Resources</title>
    <style>
        /* Base styles & Background */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #ffffff;
            /* High-tech circuit background */
            background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Optional: Dark overlay to make text readable */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 25, 0.6); /* Dark blue/purple tint */
            z-index: -1;
        }

        /* Frosted Glass Card */
        .glass-card {
            background: rgba(20, 20, 35, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
            z-index: 1;
        }

        /* Typography */
        h1 {
            color: #ffffff;
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 8px;
            line-height: 1.2;
            text-shadow: 0 0 10px rgba(170, 0, 255, 0.5); /* Neon purple glow */
        }
        
        h2 {
            color: #a0a0c0;
            font-size: 15px;
            font-weight: 400;
            margin-top: 0;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.3s ease;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Video Button - Neon Pink/Purple */
        .btn-video {
            background: linear-gradient(135deg, rgba(180, 0, 255, 0.4) 0%, rgba(80, 0, 255, 0.4) 100%);
            box-shadow: 0 0 15px rgba(180, 0, 255, 0.2);
        }
        .btn-video:hover {
            background: linear-gradient(135deg, rgba(180, 0, 255, 0.6) 0%, rgba(80, 0, 255, 0.6) 100%);
            box-shadow: 0 0 20px rgba(180, 0, 255, 0.4);
            transform: translateY(-2px);
        }

        /* Document Buttons - Cyan/Blue */
        .btn-doc {
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.2) 0%, rgba(0, 100, 255, 0.2) 100%);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.1);
        }
        .btn-doc:hover {
            background: linear-gradient(135deg, rgba(0, 200, 255, 0.4) 0%, rgba(0, 100, 255, 0.4) 100%);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Subtext */
        .subtext {
            font-size: 12px;
            color: #8888aa;
            margin-top: -5px;
            margin-bottom: 20px;
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #666688;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>IoT-Enabled Smart Shopping Cart</h1>
        <h2>Naledi Perseverance Mashabane<br>230099774</h2>

        <!-- Video Button (Update href="#" when the video is ready) -->
        <a href="https://youtube.com/shorts/LkmOlOMwoCE?si=jFioSGw2J_xaW1PU" class="btn btn-video" target="_blank">▶ Watch Demo Video</a>
        <!-- Document Buttons -->
        <a href="docs/Technical_Report.pdf" class="btn btn-doc" target="_blank" download>📄 Download Technical Report</a>
        <a href="docs/User_Manual.pdf" class="btn btn-doc" target="_blank" download>📘 Download User Manual</a>

        <div class="footer">
            Tshwane University of Technology<br>
            Project Design II (PD2316D)
        </div>
    </div>

</body>
</html>
