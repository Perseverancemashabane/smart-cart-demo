<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Smart Cart - Project Resources</title>
    <style>
        /* Base styles */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* Card container */
        .card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border-top: 8px solid #003399; /* TUT Blue */
        }
        /* Typography */
        h1 {
            color: #003399;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        h2 {
            color: #666;
            font-size: 15px;
            font-weight: 500;
            margin-top: 0;
            margin-bottom: 30px;
        }
        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.1s ease, background-color 0.3s ease;
            box-sizing: border-box;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-video {
            background-color: #CC0000; /* TUT Red */
        }
        .btn-video:hover {
            background-color: #a30000;
        }
        .btn-doc {
            background-color: #003399; /* TUT Blue */
        }
        .btn-doc:hover {
            background-color: #002266;
        }
        /* Footer */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>IoT-Enabled Smart Shopping Cart</h1>
        <h2>Naledi Perseverance Mashabane<br>230099774</h2>

        <!-- Video Button (Update the href="#" when the video is ready) -->
        <a href="#" class="btn btn-video" target="_blank">▶ Watch Demo Video</a>
        <p style="font-size: 12px; color: #999; margin-top: -5px; margin-bottom: 20px;">(Video link coming soon)</p>

        <!-- Document Buttons -->
        <a href="docs/Technical_Report.pdf" class="btn btn-doc" target="_blank" download>📄 Download Technical Report</a>
        <a href="docs/User_Manual.pdf" class="btn btn-doc" target="_blank" download>📘 Download User Manual</a>

        <div class="footer">
            Tshwane University of Technology<br>
            Project Design II (PD2316D)
        </div>
    </div>

</body>
</html>
